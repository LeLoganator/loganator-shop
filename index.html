<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOGANATOR V28</title>
<style>
:root{--a:#39a9ff;--g:rgba(255,255,255,.09);--b:26px}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--a),transparent 65%),transparent 40%),linear-gradient(135deg,#050912,#101a2a)}header{padding:18px 22px;display:flex;justify-content:space-between;position:sticky;top:0;background:#05091288;backdrop-filter:blur(22px);border-bottom:1px solid #fff2}.logo{font-weight:900;letter-spacing:.15em}button{color:#fff;background:var(--g);border:1px solid #fff3;border-radius:999px;padding:10px 16px;cursor:pointer}.primary{background:color-mix(in srgb,var(--a),transparent 55%)}main{padding:70px 22px;max-width:1050px;margin:auto}h1{font-size:clamp(45px,8vw,88px);line-height:.9}.overlay{display:none;position:fixed;inset:0;background:#0008;backdrop-filter:blur(8px);z-index:5}.open{display:block}.panel{position:absolute;right:14px;top:14px;bottom:14px;width:min(470px,calc(100% - 28px));padding:22px;overflow:auto;border-radius:32px;background:#0f1826c7;border:1px solid #fff3;backdrop-filter:blur(var(--b)) saturate(140%)}.head{display:flex;justify-content:space-between}.section{margin-top:25px}.colors{display:flex;flex-wrap:wrap;gap:8px}.sw{width:30px;height:30px;padding:0}.row{padding:14px 0;border-bottom:1px solid #fff1}.row label{display:flex;justify-content:space-between;gap:10px}.row input[type=range]{width:55%;accent-color:var(--a)}small{opacity:.55}
</style></head><body>
<header><div class="logo">LOGANATOR</div><button class="primary" id="o">Control Center</button></header>
<main><h1>LOGANATOR<br>V28</h1><p>Nouvelle interface Liquid Glass et Control Center personnalisable.</p><button class="primary" id="o2">Ouvrir le Control Center</button></main>
<div class="overlay" id="x"><section class="panel"><div class="head"><h2>Control Center</h2><button id="c">Fermer</button></div><small>V28 · Liquid Glass</small>
<div class="section"><h3>100+ couleurs</h3><div class="colors" id="cs"></div></div>
<div class="section"><h3>Effets</h3><div class="row"><label>Flou <input id="bl" type="range" min="8" max="45" value="26"></label></div><div class="row"><label>Transparence <input id="op" type="range" min="4" max="18" value="9"></label></div><div class="row"><label>Animations <input id="mo" type="checkbox" checked></label></div></div>
<div class="section"><button id="r">Réinitialiser</button></div></section></div>
<script>
const C=["39a9ff","6c5ce7","00c2a8","00d1ff","ff4d8d","ff7a18","ffd166","7cff6b","b388ff","ffffff","ff3b30","34c759","5e5ce6","af52de","ff2d55","64d2ff","30d158","ff9f0a","bf5af2","0a84ff","5856d6","ff375f","ac8e68","14c7c2","5ac8fa","ffcc00","ff9500","ff6482","32ade6","1abc9c","e056fd","686de0","4834d4","22a6b3","be2edd","eb4d4b","f0932b","6ab04c","badc58","7ed6df","30336b","130f40","535c68","95afc0","c7ecee","dff9fb","f6e58d","ffbe76","ff7979","f9ca24","7efff5","18dcff","7158e2","3c40c6","575fcf","ef5777","ffc048","ff5e57","ffdd59","05c46b","0be881","0fbcf9","d2dae2","808e9b","485460","1e272e","ff3f34","ff9f1a","f8efba","f5cd79","f19066","e77f67","786fa6","f8a5c2","63cdda","cf6a87","c44569","574b90","303952","546de5","e15f41","e66767","596275"];
const s=JSON.parse(localStorage.getItem("loganator_v28")||"{}"),q=id=>document.getElementById(id);
C.forEach(c=>{let b=document.createElement("button");b.className="sw";b.style.background="#"+c;b.onclick=()=>{s.a="#"+c;save()};q("cs").append(b)});
function apply(){document.documentElement.style.setProperty("--a",s.a||"#39a9ff");document.documentElement.style.setProperty("--b",(s.b||26)+"px");document.documentElement.style.setProperty("--g","rgba(255,255,255,"+(s.p||9)/100+")")}function save(){localStorage.setItem("loganator_v28",JSON.stringify(s));apply()}
q("bl").value=s.b||26;q("op").value=s.p||9;q("mo").checked=s.m!==false;
q("bl").oninput=e=>{s.b=+e.target.value;save()};q("op").oninput=e=>{s.p=+e.target.value;save()};q("mo").onchange=e=>{s.m=e.target.checked;save()};
q("o").onclick=q("o2").onclick=()=>q("x").classList.add("open");q("c").onclick=()=>q("x").classList.remove("open");
q("r").onclick=()=>{Object.assign(s,{a:"#39a9ff",b:26,p:9,m:true});q("bl").value=26;q("op").value=9;q("mo").checked=true;save()};apply();
</script></body></html>
